# Syncs the promo video and the text kit (54 real skills, 6 MIT repos).
name: Import promo video

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-promo.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download video and text kit
        run: |
          mkdir -p freebuff-export/remotion/out/promo
          curl -fL --retry 3 --retry-delay 2 \
            "https://site-2f41f8031e8745daaaa3f1ead41ad35f.freebuff.page/FREEBUFF-promo-v01.mp4" \
            -o freebuff-export/remotion/out/promo/FREEBUFF-promo-v01.mp4
          curl -fL --retry 3 --retry-delay 2 \
            "https://site-2f41f8031e8745daaaa3f1ead41ad35f.freebuff.page/freebuff-kit-text.zip" \
            -o freebuff-kit-text.zip
          ls -lh freebuff-export/remotion/out/promo/FREEBUFF-promo-v01.mp4 freebuff-kit-text.zip

      - name: Sync skills and docs
        run: |
          rm -rf /tmp/freebuff-kit && mkdir -p /tmp/freebuff-kit
          unzip -q freebuff-kit-text.zip -d /tmp/freebuff-kit
          rm -rf skills
          cp -r /tmp/freebuff-kit/skills ./skills
          cp /tmp/freebuff-kit/SKILLS.md ./SKILLS.md
          cp /tmp/freebuff-kit/README.md ./README.md
          cp /tmp/freebuff-kit/INIZIA-QUI.md ./INIZIA-QUI.md
          cp /tmp/freebuff-kit/VIDEO.md ./VIDEO.md
          cp /tmp/freebuff-kit/freebuff-export/README.md ./freebuff-export/README.md
          echo "skills: $(find skills -name SKILL.md | wc -l)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skills SKILLS.md README.md INIZIA-QUI.md VIDEO.md freebuff-export/README.md
          git add -f freebuff-export/remotion/out/promo/FREEBUFF-promo-v01.mp4 freebuff-kit-text.zip
          git status --short | head -60
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Sync 54 real skills, docs and promo (sync-skills)"
            git push origin HEAD:main
          fi
